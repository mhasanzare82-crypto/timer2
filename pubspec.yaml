name: timer
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
